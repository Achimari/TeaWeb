name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# teaweb-deploy replaces the release in place and restarts the container, so two
# overlapping runs would fight over the same directory.
concurrency:
  group: deploy-teaweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The store tests (tests/store.test.ts) run against a real PostgreSQL, created fresh for each run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tea
          POSTGRES_PASSWORD: tea
          POSTGRES_DB: tea
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tea" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tea:tea@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci also generates Prisma Client (the postinstall script); no database is needed for that.
      - run: npm ci

      # The checks DEPLOY.md prescribes before connecting a host.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

      # Built here, not on the droplet: it has 961 MiB of RAM and already runs
      # the NoOr app and Caddy.
      - run: npm run build

      # `output: 'standalone'` emits the server plus only the dependencies it
      # traces; static assets and public/ are not copied in and must be added.
      - name: Assemble the standalone release
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          # The receiver runs `prisma migrate deploy` from these, in a throwaway
          # container: the standalone output has no Prisma CLI (a devDependency).
          # prisma.config.ts carries the datasource url Prisma 7 no longer allows
          # in the schema, so Migrate needs it alongside the migrations.
          cp -R prisma release/prisma
          cp prisma.config.ts release/prisma.config.ts
          test -s release/server.js
          test -s release/prisma/schema.prisma
          test -s release/prisma.config.ts
          # The server talks to PostgreSQL through the pg driver adapter, so a
          # missing `pg` only fails on the first database call -- after the
          # release is already live. Check it here instead.
          test -d release/node_modules/pg \
            || { echo "::error::the pg driver was not traced into the standalone output"; exit 1; }

      - name: Ship the release to the droplet
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' '206.81.29.175 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEfBRSq5k2QIWyOX8n81pna3F8D4RIeCrAQL2a9g8J9F' > ~/.ssh/known_hosts
          # The key is pinned to /usr/local/sbin/teaweb-deploy by a forced
          # command, which rejects a payload missing server.js, .next/static or
          # the traced node_modules before replacing the running release.
          tar -cz -C release . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@206.81.29.175
